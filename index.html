<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Invitation de Mariage</title>

    <!-- AJOUT DES BALISES POUR LA MINIATURE AUTOMATIQUE SUR WHATSAPP & MESSENGER -->
    <meta property="og:title" content="💍 Réception de Mariage — Med Mourad & Wifak">
    <meta property="og:description" content="يسعدنا حضوركم معانا">
    <meta property="og:image" content="https://i.ibb.co/HDSCVFBq/8f2d331b-e0a6-4a57-9331-0bfed8dc4d0e.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">

    <style>
        :root{
            --beige: #ebe6d2;         /* couleur principale demandée */
            --beige-contrast: #f6f4ee;/* légère variante pour la carte intérieure */
            --accent: #10069F;        /* couleur Pantone existante */
            --btn-border: #d6cfbf;    /* bordure boutons assortie */
            --shadow-dark: rgba(0,0,0,0.08);
            --glow: rgba(0,127,255,0.18);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle, #ffffff 0%, #e2e8f0 100%);
            margin: 0;
            padding: 10px;
            overflow: hidden;
            box-sizing: border-box;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
        }
        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            perspective: 2000px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 95vw;
            max-width: 420px;
            aspect-ratio: 1 / 1;
            transform: translateY(114px) !important;
            opacity: 0; /* Commencer invisible et non cliquable proprement */
            transition: opacity 0.5s ease;
        }

        .envelope-wrapper.ready {
            opacity: 1; /* Devient visible et actif sur iOS */
        }

        /* Enveloppe: beige demandé */
        .envelope {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: var(--beige);
            box-shadow: 0 20px 45px var(--shadow-dark), 0 0 25px var(--glow);
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
            overflow: hidden;
            border-radius: 6px;
        }
        .envelope.reveal-card {
            overflow: visible !important;
        }
        .envelope-wrapper:hover .envelope {
            transform: translateY(-5px) rotateX(5deg);
            box-shadow: 0 25px 50px rgba(0,0,0,0.10), 0 0 35px rgba(0,127,255,0.28);
        }

        /* arrière de l'enveloppe */
        .envelope-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--beige);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.02);
            z-index: 1;
        }
        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 50% !important;
            background-color: transparent;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), background-color 0s linear 0.3s, z-index 0.1s step-end;
            z-index: 4;
            border: none !important;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.08)); /* Ombre sur le triangle adaptée */
        }

        /* verso de la languette en beige aussi */
        .envelope-wrapper.open .flap {
            transform: rotateX(180deg);
            background-color: var(--beige);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
            z-index: 1;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), background-color 0s linear 0.3s, z-index 0.1s step-end 0.3s;
            filter: drop-shadow(0 -4px 8px rgba(0, 0, 0, 0.06));
        }

        .front-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--beige) !important;
            z-index: 3;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.02), inset 0 0 0 3px rgba(255,255,255,0.92), inset 0 0 0 4px rgba(0,0,0,0.02);
        }
        .envelope-art {
            width: 100%;
            height: 65%;
            overflow: hidden;
            position: relative;
            background-color: var(--beige);
            clip-path: inset(0 0 0 0);
        }
        .envelope-art img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: top center;
            filter: saturate(0.98);
        }
        .recipient-box {
            position: absolute;
            bottom: 4%;
            left: 50%;
            width: 92%;
            transform: translateX(-50%) !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            z-index: 5;
        }
        .recipient-name-text {
            font-family: "Amiri", "Traditional Arabic", "Urdu Typesetting", serif !important;
            font-weight: 400 !important;
            font-size: 6.2vw !important;
            color: var(--accent) !important;
            direction: rtl;
            text-align: center !important;
            display: block !important;
            margin: 0 auto 8px auto !important;
            white-space: nowrap !important;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            max-width: 100% !important;
            border-bottom: 1px dotted var(--accent);
            padding-bottom: 2px !important;
            width: 100%;
            box-sizing: border-box !important;
            background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.02) 100%);
        }

        @media (min-width: 420px) {
            .recipient-name-text {
                font-size: 25px !important;
            }
        }
        .invitation-title-text {
            font-family: "Amiri", "Traditional Arabic", "Urdu Typesetting", serif !important;
            font-size: 4.8vw !important;
            font-weight: bold !important;
            color: var(--accent) !important;
            direction: rtl;
            text-align: center !important;
            width: 100%;
            margin-bottom: 20px !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            gap: 8px;
            animation: pulseGlow 2s infinite ease-in-out;
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
        }

        .invitation-title-text span {
            font-size: 5vw !important;
            display: inline-block;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.75; transform: scale(0.99); }
            50% { opacity: 1; transform: scale(1.01); }
            100% { opacity: 0.75; transform: scale(0.99); }
        }

        @media (min-width: 420px) {
            .invitation-title-text {
                font-size: 19px !important;
                margin-bottom: 20px !important;
            }
            .invitation-title-text span { font-size: 20px !important; }
        }

        .buttons-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 2px;
            box-sizing: border-box;
            gap: 8px;
        }
        /* carte intérieure légèrement plus claire que l'enveloppe pour contraste */
        .card {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--beige-contrast);
            z-index: 2;
            opacity: 0;
            visibility: hidden;
            box-shadow: 0 0 0 rgba(0, 0, 0, 0);
            display: flex;
            flex-direction: column;
            will-change: transform, opacity;
            transition: transform 1s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.2s ease, visibility 0s linear 1s;
            border-radius: 6px;
            overflow: hidden;
        }

        .card-image-part {
            position: relative;
            width: 100%;
            height: 100%;
            background: transparent;
        }
        .card-image-part img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .envelope-wrapper.open .card {
            opacity: 1 !important;
            visibility: visible !important;
            transform: translateY(-100%);
            z-index: 2;
            transition: transform 1.6s cubic-bezier(0.25, 1, 0.5, 1) 0.5s, opacity 0.1s linear 0.5s, visibility 0s linear 0.5s;
        }
        .envelope-wrapper.open .card.settle {
            z-index: 5 !important;
            transform: translateY(-28%);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.10), 0 5px 15px rgba(0, 0, 0, 0.04);
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.5s ease;
        }
        .action-btn {
            opacity: 0;
            visibility: hidden;
            transform: translateY(5px);
            transition: opacity 0.4s ease, transform 0.4s ease, background-color 0.2s, border-color 0.2s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            white-space: nowrap;
        }
        .maps-btn, .calendar-btn, .audio-btn {
            background-color: #ffffff; /* boutons blancs pour contraste sur beige */
            color: var(--accent) !important; /* Texte des boutons en Pantone 072 C */
            border: 1px solid var(--btn-border);
            padding: 6px 12px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 11px;
            font-weight: 600;
            border-radius: 15px;
            cursor: pointer !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            white-space: nowrap !important;
            flex-wrap: nowrap !important;
        }

        .maps-btn:hover, .calendar-btn:hover, .audio-btn:hover {
            background-color: #fbfbfb;
            border-color: var(--accent) !important;
        }

        .maps-btn svg, .audio-btn svg {
            width: 14px;
            height: 14px;
            display: inline-block !important;
            flex-shrink: 0 !important;
        }

        /* Forcer la couleur Pantone 072 C sur les tracés SVG internes des icônes */
        .maps-btn svg path, .audio-btn svg path {
            fill: var(--accent) !important;
        }

        .action-btn.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <audio id="bgMusic" loop preload="auto">
        <source src="https://files.catbox.moe/owgvs1.mp3" type="audio/mpeg">
    </audio>
    <div class="envelope-wrapper" id="envelopeContainer">
        <div class="envelope" id="envelopeBody">
            <div class="envelope-back"></div>
            <div class="flap"></div>
            <div class="card">
                <div class="card-image-part">
                    <img src="https://i.ibb.co/pBdDYs0K/S-K-Invitation1.png" alt="Invitation Mariage" id="invitationImg">
                </div>
            </div>
            <div class="front-face">
                <div class="envelope-art">
                    <img src="https://i.ibb.co/b524bTYL/enveloppe.png" alt="Illustration Cote Gammarth">
                </div>
                <div class="recipient-box">
                    <!-- NOUVEAU : Titre d'invitation en arabe rassurant -->
                    <div class="invitation-title-text"><span>👆</span> بــــطــاقـة دعـــوة </div>
                    <div id="recipientName" class="recipient-name-text"></div>
                    <div class="buttons-row">
                        <button class="action-btn maps-btn" id="mapsButton">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"></path>
                            </svg>
                            Google Maps
                        </button>
                        <button class="action-btn audio-btn" id="audioButton" aria-pressed="false">
                            <svg viewBox="0 0 24 24" id="audioIcon" aria-hidden="true">
                                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path>
                            </svg>
                            <span id="audioText">Mute</span>
                        </button>
                        <button class="action-btn calendar-btn" id="calendarBtn">📅 Calendrier</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('envelopeContainer');
        const envelopeBody = document.getElementById('envelopeBody');
        const card = document.querySelector('.card');
        const img = document.getElementById('invitationImg');
        const mapsButton = document.getElementById('mapsButton');
        const audioButton = document.getElementById('audioButton');
        const audioIcon = document.getElementById('audioIcon');
        const audioText = document.getElementById('audioText');
        const recipientElement = document.getElementById('recipientName');
        const calendarButton = document.getElementById('calendarBtn');
        const audio = document.getElementById('bgMusic');
        audio.volume = 0.3;

        // Read "nom" param safely (works in iframe and top window when allowed)
        try {
            let guestName = null;
            const url = new URL(window.location.href);
            guestName = url.searchParams.get('nom');

            if (!guestName && window.top !== window) {
                try {
                    const topUrl = new URL(window.top.location.href);
                    guestName = topUrl.searchParams.get('nom');
                } catch (err) {
                    // cross-origin access to top location not allowed; ignore
                }
            }

            if (guestName) {
                const decodedName = decodeURIComponent(guestName);
                recipientElement.innerText = " " + decodedName.replace(/_/g, ' ');
            }
        } catch (e) {
            console.log("Erreur URL", e);
        }

        function activateEnvelope() {
            wrapper.classList.add('ready');
        }
        if (img.complete) {
            activateEnvelope();
        } else {
            img.addEventListener('load', activateEnvelope);
        }

        wrapper.addEventListener('click', (event) => {
            // if clicked on one of the control buttons, don't toggle envelope
            if (event.target.closest('#mapsButton') || event.target.closest('#calendarBtn') || event.target.closest('#audioButton')) return;

            if (!wrapper.classList.contains('open')) {
                wrapper.classList.add('open');
                // try to play music; browsers may block until user interacts
                audio.currentTime = 0;
                audio.play().catch(err => console.log("Attente action :", err));
                setTimeout(() => { envelopeBody.classList.add('reveal-card'); }, 400);
                setTimeout(() => { card.classList.add('settle'); }, 2100);
                setTimeout(() => {
                    mapsButton.classList.add('show');
                    audioButton.classList.add('show');
                    calendarButton.classList.add('show');
                }, 2500);
            } else {
                mapsButton.classList.remove('show');
                audioButton.classList.remove('show');
                calendarButton.classList.remove('show');
                card.classList.remove('settle');
                audio.pause();
                audio.muted = false;
                audioText.innerText = "Mute";
                // restore audio icon (uses CSS fill)
                audioIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path>';

                setTimeout(() => {
                    wrapper.classList.remove('open');
                    envelopeBody.classList.remove('reveal-card');
                }, 200);
            }
        });

        audioButton.addEventListener('click', (event) => {
            event.stopPropagation();
            // toggle mute and update UI; try to play if unmuting
            if (audio.muted) {
                audio.muted = false;
                audioText.innerText = "Mute";
                audioIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"></path>';
                audio.play().catch(() => {});
                audioButton.setAttribute('aria-pressed', 'false');
            } else {
                audio.muted = true;
                audioText.innerText = "Play";
                audioIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"></path>';
                audioButton.setAttribute('aria-pressed', 'true');
            }
        });

        mapsButton.addEventListener('click', (event) => {
            event.stopPropagation();
            window.open("https://maps.app.goo.gl/F1CkBSKwH1f2dXNb7", '_blank');
        });

        calendarButton.addEventListener('click', (e) => {
            e.stopPropagation();
            const icsContent = [
                "BEGIN:VCALENDAR",
                "VERSION:2.0",
                "BEGIN:VEVENT",
                "UID:" + Date.now() + "@mariage.com",
                "DTSTAMP:20260517T120000Z",
                "DTSTART:20260822T173000Z",
                "DTEND:20260822T200000Z",
                "SUMMARY:Mariage de Med Mourad & Wifak 💍",
                "DESCRIPTION:Célébration du mariage à l'hôtel Four Seasons Gammarth.",
                "LOCATION:Four Seasons Gammarth, Tunisie",
                "END:VEVENT",
                "END:VCALENDAR"
            ].join("\r\n");

            // Détection stricte d'iOS (iPhone / iPad / Safari mobile)
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            if (isIOS) {
                // Méthode universelle validée pour forcer l'ouverture sur le calendrier de l'iPhone
                const uri = "data:text/calendar;charset=utf8," + encodeURIComponent(icsContent);
                window.open(uri, '_blank');
            } else {
                // Méthode classique de téléchargement pour Android et PC
                const blob = new Blob([icsContent], { type: "text/calendar;charset=utf-8;" });
                const link = document.createElement("a");
                link.href = window.URL.createObjectURL(blob);
                link.setAttribute("download", "Mariage_Med_Mourad_&_Wifak.ics");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        });

        // Arrête immédiatement la musique si l'utilisateur quitte l'onglet ou l'application mobile
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                audio.pause();
            } else if (wrapper.classList.contains('open') && !audio.muted) {
                // Optionnel : relance la musique si l'utilisateur revient sur l'onglet et que l'enveloppe est ouverte
                audio.play().catch(e => console.log(e));
            }
        });
    </script>
</body>
</html>
